services:
  nuvexa:
    build: .
    container_name: nuvexa-ai
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - nuvexa_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  nuvexa_data:
    driver: local
